<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Página Web</title>
    <!-- Bootswatch Darkly -->
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/darkly/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Carrusel */
        .carrusel {
            position: relative;
            overflow: hidden;
        }
        .carrusel-imagenes img {
            width: 100%;
            display: none;
            border-radius: 10px;
        }
        .carrusel-imagenes img.activo {
            display: block;
        }
        /* QR más elegante */
        #qrcode {
            padding: 10px;
            background: rgb(228, 8, 92);
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <!-- MENÚ DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Proyecto11</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html">Nosotros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="registro.html">Registro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard_cliente.html">Dashboard Cliente</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard_admin.html">Dashboard Admin</a>
                </ul>
                <!-- Botón de Iniciar Sesión -->
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="btn btn-outline-light" href="login.html">Iniciar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container mt-5 text-center">
        <h1>Bienvenido a mi Proyecto Web</h1>
        
        <!-- Carrusel Automático -->
        <div class="carrusel my-4">
            <div class="carrusel-imagenes">
                <img src="https://picsum.photos/800/400?random=1" class="slide activo" alt="Slide 1">
                <img src="https://picsum.photos/800/400?random=2" class="slide" alt="Slide 2">
                <img src="https://picsum.photos/800/400?random=3" class="slide" alt="Slide 3">
            </div>
        </div>

        <h3 class="mt-4">Escanea el código QR para visitar mi GitHub:</h3>
        <div class="mt-3">
            <div id="qrcode"></div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center p-3 mt-5">
        <p>2026 - Proyecto Web</p>
    </footer>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Librería QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Carrusel automático -->
    <script>
    let slides = document.querySelectorAll(".slide");
    let index = 0;
    function mostrarSlide() {
        slides.forEach(slide => slide.classList.remove("activo"));
        if (slides.length > 0) {
            slides[index].classList.add("activo");
            index++;
            if(index >= slides.length) index = 0;
        }
    }
    if (slides.length > 0) {
        setInterval(mostrarSlide, 3000);
    }
    </script>

    <!-- Generar QR apuntando a GitHub -->
    <script>
    new QRCode(document.getElementById("qrcode"), {
        text: "https://mkarinamb09-bit.github.io/proyecto11/",
        width: 150,
        height: 150
    });
    </script>

</body>
</html>
